# Evaluator executes these commands in order from a fresh checkout.
setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python src/main.py intent --query \"When does the player score a goal?\" --video-type sports"
  - "python src/main.py chunks --duration 95 --chunk-seconds 30 --overlap-seconds 5"

test_commands:
  - "pytest -q"

notes: "CPU-only baseline. Video classifier training requires a labeled path,label CSV. The VideoMME 10% benchmark data is not bundled; see docs/README.md before reporting benchmark metrics."
